<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字人测试入口</title>
    <script src="nuwasdk/js/npcTalkFloatingButton.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: #f5f5f5; display: flex; align-items: center;
        justify-content: center; min-height: 100vh;
      }
      .card {
        background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        padding: 32px; width: 420px; max-width: 90vw;
      }
      h2 { font-size: 18px; margin-bottom: 20px; color: #333; }
      label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
      input {
        width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px;
        font-size: 14px; margin-bottom: 14px; outline: none; transition: border 0.2s;
      }
      input:focus { border-color: #409eff; }
      .btn {
        width: 100%; padding: 12px; border: none; border-radius: 6px;
        font-size: 15px; font-weight: bold; cursor: pointer;
        color: #fff; background: #409eff; transition: background 0.2s;
      }
      .btn:hover { background: #66b1ff; }
      .btn:disabled { background: #c0c4cc; cursor: not-allowed; }
      .status {
        margin-top: 14px; padding: 10px; border-radius: 6px;
        font-size: 13px; display: none; line-height: 1.6;
      }
      .status.ok { display: block; background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
      .status.err { display: block; background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
      .status.loading { display: block; background: #f4f4f5; color: #909399; border: 1px solid #e9e9eb; }
      .saved { font-size: 12px; color: #999; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>数字人测试入口</h2>

      <label>Secret Key</label>
      <input id="secretKey" type="text" placeholder="sk-xxxxxx" />

      <label>数字人 Avatar ID</label>
      <input id="avatarId" type="text" placeholder="例: 1948262256262123522" />

      <label>用户 ID</label>
      <input id="userId" type="text" placeholder="例: 54" />

      <div class="saved" id="savedHint"></div>

      <button class="btn" id="goBtn" onclick="go()">认证并进入数字人</button>

      <div class="status" id="status"></div>
    </div>

    <script>
      // 自动填充上次的输入
      var fields = ['secretKey', 'avatarId', 'userId'];
      fields.forEach(function (f) {
        var saved = localStorage.getItem('test_' + f);
        if (saved) document.getElementById(f).value = saved;
      });

      // 如果已有 token，提示
      var existingToken = localStorage.getItem('token');
      if (existingToken) {
        document.getElementById('savedHint').textContent =
          '已有缓存 token: ' + existingToken.substring(0, 20) + '...';
      }

      function setStatus(msg, type) {
        var el = document.getElementById('status');
        el.className = 'status ' + type;
        el.textContent = msg;
      }

      function go() {
        var secretKey = document.getElementById('secretKey').value.trim();
        var avatarId = document.getElementById('avatarId').value.trim();
        var userId = document.getElementById('userId').value.trim();

        if (!secretKey || !avatarId || !userId) {
          setStatus('请填写所有字段', 'err');
          return;
        }

        // 保存到 localStorage，下次自动填充
        fields.forEach(function (f) {
          localStorage.setItem('test_' + f, document.getElementById(f).value.trim());
        });

        var btn = document.getElementById('goBtn');
        btn.disabled = true;
        btn.textContent = '认证中...';
        setStatus('正在获取 token...', 'loading');

        fetch('https://api.nuwaai.com/web/apiKey/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secretKey: secretKey }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.code === 0) {
              localStorage.setItem('token', data.data);
              setStatus('认证成功，正在跳转...', 'ok');

              // 跳转到数字人页面
              setTimeout(function () {
                window.location.href =
                  'nuwasdk/index.html?id=' + encodeURIComponent(avatarId) +
                  '&userId=' + encodeURIComponent(userId);
              }, 500);
            } else {
              setStatus('认证失败: ' + (data.msg || '未知错误'), 'err');
              btn.disabled = false;
              btn.textContent = '认证并进入数字人';
            }
          })
          .catch(function (err) {
            setStatus('请求失败: ' + err.message, 'err');
            btn.disabled = false;
            btn.textContent = '认证并进入数字人';
          });
      }

      // 回车提交
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') go();
      });
    </script>
  </body>
</html>
